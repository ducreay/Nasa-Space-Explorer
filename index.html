<!DOCTYPE html>
<html lang="en">

<!-- Head -->
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link rel="icon" type="image/png" href="img/NASA-Meatball-Centered.png" />
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<!-- Body -->
<body>
  <div class="container">
    <!-- Header -->
    <header class="site-header">
      <!-- Nasa Meatball -->
      <a href="https://www.nasa.gov/" target="_blank" rel="noopener noreferrer" aria-label="Visit NASA's website">
        <img src="img/NASA-Meatball-Centered.png" alt="NASA Meatball logo" class="logo" />
      </a>
      <!-- Nasa Worm Logo + Header Text -->
      <div class="header-brand">
        <img src="img/nasa-worm-logo.png" alt="NASA Worm logo" class="worm-logo" />
        <h1>Space Explorer</h1>
      </div>
    </header>

    <!-- Filters and Button -->
    <div class="filters">
      <input type="date" id="startDate" />
      <input type="date" id="endDate" />
      <button id="button">Get Space Images</button>
    </div>

    <!-- Gallery Display -->
    <div id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p id="hook"></p>
        <p id="sentence">Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>
    <button id="view-more" class="view-more" type="button" hidden>View More</button>
  </div>

  <!-- Model Display -->
  <div id="apod-modal" class="apod-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-content">
      <button id="modal-close" class="modal-close" type="button" aria-label="Close details">&times;</button>
      <div id="modal-media"></div>
      <h2 id="modal-title"></h2>
      <p id="modal-date"></p>
      <p id="modal-explanation"></p>
      <a id="modal-permalink" target="_blank" rel="noopener noreferrer">View APOD page</a>
    </div>
  </div>

  <!-- Link Javascript Scripts -->
  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
